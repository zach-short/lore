[project]
name = "movienight"
version = "0.1.0"
description = "Group movie recommender over the friend group's public Letterboxd histories. See SCOPING.md."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "feedparser>=6.0",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "tenacity>=8.2",
]

[project.scripts]
movienight = "movienight.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["movienight"]

[tool.pytest.ini_options]
testpaths = ["tests"]
