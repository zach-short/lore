name: supabase keepalive

# Free Supabase projects pause after a week without activity.
# This job calls public.keepalive() twice a week.
# lore has no publishable key in .env.example, so this job uses the service role key.
on:
  schedule:
    - cron: "47 9 * * 1,4"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: query the database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          curl --fail --silent --show-error --retry 3 -X POST \
            "$SUPABASE_URL/rest/v1/rpc/keepalive" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY"
